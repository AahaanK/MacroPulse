version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: macropulse-postgres
    restart: always
    environment:
      POSTGRES_DB: macropulse
      POSTGRES_USER: macropulse
      POSTGRES_PASSWORD: macropulse_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macropulse -d macropulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: macropulse-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://macropulse:macropulse_secure_password@db:5432/macropulse
      FRED_API_KEY: ${FRED_API_KEY:-}
      DEBUG: "false"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: macropulse-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
