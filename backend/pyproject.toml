[project]
name = "macropulse"
version = "1.0.0"
description = "Macroeconomic Event Impact & Market Sentiment Research Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "httpx>=0.27.0",
    "pandas-market-calendars>=4.4.0",
    "tenacity>=9.0.0",
    "reportlab>=4.2.0",
    "matplotlib>=3.9.0",
    "scikit-learn>=1.5.0",
    "yfinance>=0.2.48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
